name: Bandit

on:
  push:
    branches: [main]
permissions:
  security-events: write
  # only required for workflows in private repositories
  actions: read
  contents: read

jobs:
  analyze:
    runs-on:
      ubuntu-latest
      # required for all workflows
    steps:
      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@v1.0.1